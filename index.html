<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance | We'll Be Back Soon</title>
    <style>
        /* Modern Reset & Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #7f8c8d;
        }

        .progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 20px;
            margin: 30px 0;
            height: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 70%; /* Adjust this based on your actual progress */
            height: 100%;
            background-color: #3498db;
            transition: width 0.5s ease-in-out;
        }

        .contact {
            margin-top: 30px;
            font-size: 0.9rem;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }

        /* Subtle Animation */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .gears {
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon gears">🛠️</div>
        <h1>Under Maintenance</h1>
        <p>We're currently upgrading our systems to provide you with a better experience. We should be back online shortly-ALSON!</p>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <p class="contact">
            Need urgent help? <br> 
            Email us at <a href="mailto:Alson69xyz@gmail.com">support@yourdomain.com</a>
        </p>
    </div>

</body>
</html>
